name: Unreal File Index Test

on:
  push:
    branches:
      - unreal-file-index
  pull_request:
    paths:
      - "src/cli_main.cpp"
      - "src/unreal_file_index.*"
      - "src/index_service_main.cpp"
      - "Makefile"
      - ".github/workflows/unreal-index-test.yml"

jobs:
  linux-cli-index-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        run: make cli

      - name: Run index self-test
        run: ./build/uph index test

      - name: Exercise rebuild and search
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/Game/Plugins/SamplePlugin"
          printf '{}\n' > "$root/Game/SampleProject.uproject"
          printf '{}\n' > "$root/Game/Plugins/SamplePlugin/SamplePlugin.uplugin"
          ./build/uph index rebuild "$root"
          ./build/uph find SampleProject --projects --all
          ./build/uph find SamplePlugin --plugins --all

  windows-cli-index-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI with MinGW
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & "C:\mingw64\bin\g++.exe" -std=c++20 -O2 -Wall -Wextra -Wpedantic src/cli_main.cpp src/unreal_file_index.cpp -o build/uph-mingw.exe -lshell32 -lole32 -luuid -luser32 -ladvapi32 -mconsole
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\mingw64\bin\g++.exe" -std=c++20 -O2 -Wall -Wextra -Wpedantic src/index_service_main.cpp src/unreal_file_index.cpp -o build/uph-index-service-mingw.exe -ladvapi32 -mconsole
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run MinGW index self-test
        shell: cmd
        run: |
          build\uph-mingw.exe index test
          build\uph-index-service-mingw.exe --self-test

      - name: Fetch GUI headers
        shell: cmd
        run: git submodule update --init --depth 1 third_party/imgui third_party/SDL

      - name: Syntax-check GUI with shared index
        shell: powershell
        run: |
          & "C:\mingw64\bin\g++.exe" -std=c++20 -Wall -Wextra -Wpedantic -fsyntax-only -Ithird_party/SDL/include -Ithird_party/imgui -Ithird_party/imgui/backends src/main.cpp src/unreal_file_index.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build CLI with MSVC
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++20 /EHsc /W4 src\cli_main.cpp src\unreal_file_index.cpp /Febuild\uph.exe shell32.lib ole32.lib uuid.lib user32.lib advapi32.lib
          cl /nologo /std:c++20 /EHsc /W4 src\index_service_main.cpp src\unreal_file_index.cpp /Febuild\uph-index-service.exe advapi32.lib

      - name: Run index self-test
        shell: cmd
        run: |
          build\uph.exe index test
          build\uph-index-service.exe --self-test

      - name: Exercise rebuild and search
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "uph-index-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "Game\Plugins\SamplePlugin") | Out-Null
          '{}' | Set-Content (Join-Path $root "Game\SampleProject.uproject")
          '{}' | Set-Content (Join-Path $root "Game\Plugins\SamplePlugin\SamplePlugin.uplugin")
          .\build\uph.exe index rebuild $root
          .\build\uph.exe find SampleProject --projects --all
          .\build\uph.exe find SamplePlugin --plugins --all
